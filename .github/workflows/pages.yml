# Publica o cliente no GitHub Pages a cada push no main.
# O endereço do servidor de jogo vem da variável do repositório KUSA_SERVER_URL
# (Settings → Secrets and variables → Actions → Variables).
name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w @kusa/client
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SERVER_URL: ${{ vars.KUSA_SERVER_URL || 'https://kusa-server.onrender.com' }}
          VITE_SUPABASE_URL: https://niaylxoatuxkqwwnlsic.supabase.co
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
