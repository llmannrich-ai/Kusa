<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kusa</title>
  </head>
  <body>
    <div id="game"></div>

    <section id="menu" class="panel">
      <h1>Kusa</h1>
      <p class="tagline">Entre, saqueie e saia antes que a dungeon desabe.</p>

      <label>Nome
        <input id="name" maxlength="16" placeholder="Aventureiro" />
      </label>

      <fieldset id="classes">
        <legend>Classe</legend>
      </fieldset>

      <div class="actions">
        <button id="create" class="primary">Criar hunt</button>
        <div class="join">
          <input id="code" placeholder="Código da equipe" />
          <button id="join">Entrar</button>
        </div>
      </div>
      <p id="menu-error" class="error" hidden></p>
    </section>

    <section id="lobby" class="panel" hidden>
      <h2>Equipe</h2>
      <p>Código: <code id="lobby-code"></code> <small>(envie para até 3 amigos)</small></p>
      <ul id="lobby-players"></ul>
      <button id="start" class="primary">Começar hunt</button>
      <p id="lobby-wait" hidden>Aguardando o líder iniciar…</p>
    </section>

    <div id="hud" hidden>
      <div id="timer">0:00</div>
      <div id="stats"></div>
    </div>
    <p id="help" hidden>WASD/setas: andar · Clique ou Tab: alvo · Esc: limpar alvo</p>

    <section id="result" class="panel" hidden>
      <h2 id="result-title"></h2>
      <p id="result-detail"></p>
      <button id="back" class="primary">Voltar ao menu</button>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
